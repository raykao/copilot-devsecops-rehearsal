# Starter for the DevSecOps session (pipeline). Copilot extends this into the
# full validate -> plan -> approve -> apply -> smoke workflow. See specs/INFRA.md.
name: Infrastructure

on:
  pull_request:
    paths: [infra/**]
  push:
    branches: [main]
    paths: [infra/**]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
